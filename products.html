{% extends "base.html" %}

{% block content %}

<h2>Products</h2>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Category</th>

<th>Quantity</th>

<th>Price</th>

</tr>

</thead>

<tbody>

{% for product in products %}

<tr>

<td>{{ product.id }}</td>

<td>{{ product.name }}</td>

<td>{{ product.category }}</td>

<td>{{ product.quantity }}</td>

<td>{{ product.price }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
