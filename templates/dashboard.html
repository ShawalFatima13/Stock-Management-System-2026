{% extends "base.html" %}

{% block content %}

<h2 class="mb-4 fw-bold">Dashboard</h2>

<div class="alert alert-info">
    <h4>👋 Welcome Admin</h4>
    <p>Manage your inventory from the dashboard.</p>
</div>

<!-- Date & Time -->

<div class="row mb-4">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body text-center">

                <h5>📅 Today's Date</h5>

                <h4 id="todayDate"></h4>

            </div>

        </div>

    </div>

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body text-center">

                <h5>⏰ Current Time</h5>

                <h4 id="currentTime"></h4>

            </div>

        </div>

    </div>

</div>

<!-- Dashboard Cards -->

<div class="row">

    <div class="col-md-3">

        <div class="card dashboard-card bg-primary text-white">

            <div class="card-body text-center">

                <h5>Total Products</h5>

                <h2>120</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card bg-success text-white">

            <div class="card-body text-center">

                <h5>Categories</h5>

                <h2>8</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card bg-warning">

            <div class="card-body text-center">

                <h5>Low Stock</h5>

                <h2>18</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card bg-danger text-white">

            <div class="card-body text-center">

                <h5>Suppliers</h5>

                <h2>10</h2>

            </div>

        </div>

    </div>

</div>

<!-- Chart -->

<div class="card shadow mt-4">

    <div class="card-body">

        <h4 class="mb-3">📊 Stock Overview</h4>

        <canvas id="stockChart"></canvas>

    </div>

</div>

<!-- Admin Profile & Quick Actions -->

<div class="row mt-4">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body text-center">

                <i class="bi bi-person-circle display-1 text-primary"></i>

                <h3 class="mt-3">Admin</h3>

                <p>Stock Manager</p>

                <span class="badge bg-success">Online</span>

            </div>

        </div>

    </div>

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h4>Quick Actions</h4>

                <hr>

                <button class="btn btn-primary w-100 mb-2">
                    ➕ Add Product
                </button>

                <button class="btn btn-success w-100 mb-2">
                    📦 View Products
                </button>

                <button class="btn btn-warning w-100 mb-2">
                    📊 Reports
                </button>

                <button class="btn btn-danger w-100">
                    🚪 Logout
                </button>

            </div>

        </div>

    </div>

</div>

{% endblock %}
